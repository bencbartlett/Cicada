# Cicada workspace — layout and layering per docs/14-engineering-foundations.md.
# Dependency direction is law: core ← {geom, lang, stdlib, sched, script} ← server ← cli.
# A workspace test (crates/cicada-cli/tests/dependency_dag.rs) enforces it.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
# MSRV = current stable, updated freely (doc 14 — solo project, no legacy burden).
rust-version = "1.97"
publish = false # all rights reserved while private (DECISIONS.md 2026-08-11)

[workspace.dependencies]
# In-workspace crates (path deps so version bumps stay in one place).
cicada-core = { path = "crates/cicada-core" }
cicada-macros = { path = "crates/cicada-macros" }
cicada-geom = { path = "crates/cicada-geom" }
cicada-lang = { path = "crates/cicada-lang" }
cicada-stdlib = { path = "crates/cicada-stdlib" }
cicada-sched = { path = "crates/cicada-sched" }
cicada-script = { path = "crates/cicada-script" }
cicada-server = { path = "crates/cicada-server" }

# External. thiserror in libraries; anyhow only in cicada-cli (doc 14).
anyhow = "1"
# Server stack (doc 13): axum + tokio quarantined in cicada-server; the WS
# feature carries the binary geometry frames.
axum = { version = "0.8", features = ["ws", "http1", "json", "query", "tokio", "macros"], default-features = false }
base64 = "0.22"
blake3 = "1"
bytes = "1"
cargo_metadata = "0.19"
clap = { version = "4", features = ["derive"] }
# cxx: names the binding's `UniquePtr<TopoDS_Shape>` in the OCCT seam and
# declares cicada-geom's own glue bridge (src/occt/glue.rs); cxx-build
# compiles that bridge's C++ in cicada-geom's build.rs (same major as
# opencascade-sys's own, so one copy of each is built).
cxx = "1"
cxx-build = "1"
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
glam = "0.30"
insta = { version = "1", features = ["json"] }
inventory = "0.3"
# Manifold mesh-boolean kernel (DECISIONS.md rented-kernels row). f64-native
# bindings (from_mesh_f64/to_mesh_f64) — probe-verified 2026-08-18: typed
# NotManifold refusal at construction, byte-deterministic across processes,
# ~0.1 ms per cube-scale boolean. Builds upstream Manifold v3.5.2 via cmake
# at first build (git clone + FetchContent — needs cmake + network once;
# MANIFOLD_CSG_LIB_DIR is the hermetic escape hatch).
manifold-csg = "0.4"
mime_guess = "2"
# Project-directory watching (doc 13 §External changes): debounced reload
# barrier + snapshot broadcast.
notify = "8"
# OCCT B-rep kernel (DECISIONS.md rented-kernels row, revised 2026-08-19/20;
# probe docs/probes/occt-2026-08.md). Ben's fork of opencascade-rs, branch
# `cicada`, pinned by rev: upstream d114250 + exactly the reviewed patches
# (MSVC handle aliases = PR #230's source part; the honest BinTools/BRepTools
# writers with explicit flags + pinned format versions; in-memory
# serialization; the TOTAL exception boundary — Standard_Failure,
# std::exception and catch (...) → Err; the `cicada` glue the seam calls; no
# OCCT source submodule, so the clone every build pays is 6 MB, not 580 MB;
# LGPL-2.1-only manifests). Links a PREBUILT OCCT 7.8.1 found through
# DEP_OCCT_ROOT (tools/fetch_occt.py); never the source build. Only
# cicada-geom's `occt` feature activates it — default builds compile no C++.
opencascade-sys = { git = "https://github.com/bencbartlett/opencascade-rs", rev = "960a8bcb9e3dbf1916778dabb8288c1bda4c6d91", default-features = false }
# default-features = false drops `heapless-cas` (heapless 0.7 → the
# unmaintained atomic-polyfill, RUSTSEC-2023-0089 — nightly cargo-deny went
# red on it 2026-08-14); the std store never touched those code paths.
postcard = { version = "1", default-features = false, features = ["alloc", "use-std"] }
proc-macro2 = "1"
proptest = "1"
quote = "1"
rayon = "1"
# The official MCP Rust SDK (Apache-2.0) behind `cicada mcp` (DECISIONS.md
# documentation-pipeline row, 2026-08-19). Server + stdio transport only:
# no `macros` (the tools are plain `ToolBase`/`SyncTool` impls the
# workspace lints can see), no HTTP/auth/client features.
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
rmpv = "1"
# JSON Schema derive for the MCP tools' inputs and outputs (rmcp's schema
# engine; MIT).
schemars = "1"
# The embedded SPA (doc 13: `cicada serve` is the whole app) — behind the
# server's `embed` feature so debug/test builds need no `web/dist`.
rust-embed = { version = "8", features = ["interpolate-folder-path", "debug-embed"] }
serde = { version = "1", features = ["derive"] }
spade = "2"
serde_json = "1"
syn = { version = "2", features = ["full"] }
tempfile = "3"
thiserror = "2"
tokio-tungstenite = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
trybuild = "1"
# Glyph outlines for the text nodes (DECISIONS.md rented-kernels row:
# ttf-parser for text outlines). Parsing only — no layout tables, no
# variable fonts, no glyph names: the stdlib bundles one static font and
# lays text out itself (stage 6).
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
zstd = "0.13"

[workspace.lints.rust]
# `unsafe` only inside FFI seam modules (doc 14): deny globally, opt out per
# module with a narrow `#[allow(unsafe_code)]` plus `// SAFETY:` comments.
unsafe_code = "deny"
# Doc comments are the single documentation source (doc 14) — undocumented
# public items are a build error under CI's -D warnings.
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Fail loudly and immediately (doc 14): proper errors or invariant panics with
# messages. Tests are exempt via clippy.toml (allow-unwrap-in-tests).
unwrap_used = "deny"
expect_used = "deny"
# Curated pedantic allow-list (doc 14 open question): grown from real noise
# only, never speculatively. Each entry carries the reason it earned its place.
# (empty so far)

# Overflow checks on in ALL profiles including release (DECISIONS.md):
# a wrong answer is worse than a loud refusal.
[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

[profile.bench]
overflow-checks = true
