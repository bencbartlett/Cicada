[package]
name = "cicada-server"
description = "Cicada engine server: axum app, protocol, sessions, undo/redo op log, solve loop, binary frames, git routes over the git binary, debug endpoints (transport arrives with v0.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Embed the built SPA (`web/dist`) into the binary — the release shape of
# doc 13 ("`cicada serve` is the whole app"). Off by default so debug and
# test builds need no `npm run build`; without it `cicada serve` serves the
# API + `--web-dir <dir>` (a built SPA on disk) or the Vite dev proxy flow,
# and says so loudly at `/`.
embed = ["dep:rust-embed"]

[dependencies]
axum.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
cicada-core.workspace = true
cicada-geom.workspace = true
cicada-lang.workspace = true
cicada-sched.workspace = true
cicada-script.workspace = true
cicada-stdlib.workspace = true
futures-util.workspace = true
getrandom.workspace = true
mime_guess.workspace = true
notify.workspace = true
rust-embed = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
