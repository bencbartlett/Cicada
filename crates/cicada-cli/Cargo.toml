[package]
name = "cicada-cli"
description = "The cicada binary: serve, run, mcp, fmt, docs, catalog, cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cicada"
path = "src/main.rs"

[dependencies]
# anyhow is allowed ONLY in this crate (doc 14 §Toolchain).
anyhow.workspace = true
cicada-core.workspace = true
cicada-lang.workspace = true
cicada-sched.workspace = true
# The server owns the hydration path (compile/lower/scripts) and `serve`;
# only this crate may depend on it (dependency law).
cicada-server.workspace = true
cicada-stdlib.workspace = true
clap.workspace = true
# `cicada mcp`: the MCP server over stdio (doc 11 read tools, v0.1).
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
# Forwarded to the server: embed the built SPA (`web/dist`) into the
# binary — the release / Playwright-CI shape of `cicada serve`.
embed = ["cicada-server/embed"]

[dev-dependencies]
cargo_metadata.workspace = true
tempfile.workspace = true

[lints]
workspace = true
