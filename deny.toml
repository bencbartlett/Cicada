# cargo-deny configuration (nightly CI, doc 14). Curate as real dependencies
# arrive; entries here should carry reasons, not speculation.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # ttf-parser was declared unmaintained (2026). Cicada parses only the
  # BUNDLED DejaVu Sans Bold bytes (trusted, offline, read-only) through a
  # small seam in crates/cicada-geom/src/text.rs; swap to skrifa (fontations)
  # when fonts become user-supplied (DECISIONS.md rented-kernels row, stage-6
  # note). Stage 6, 2026-08-19.
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; only bundled trusted font bytes are parsed; skrifa swap planned with user-supplied fonts" },
]

[licenses]
# The workspace itself is unpublished (all rights reserved while private);
# this list constrains DEPENDENCIES we may vendor into builds. The workspace
# crates carry no license field by design — exempt them from the dep policy.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

# OCCT seam (docs/probes/occt-2026-08.md §Q4, DECISIONS.md OCCT-licensing
# row). LGPL-2.1-only is allowed ONLY for the OCCT binding crate. The fork's
# manifests declare the current SPDX id (`LGPL-2.1-only`; upstream's
# deprecated bare `LGPL-2.1` meant the same licence and made cargo-deny
# warn on every run) — the exception is spelled as the crate's expression
# parses, so a rev bump to a manifest that says otherwise fails here, loudly.
# cicada-geom depends on `opencascade-sys` alone, so the high-level
# `opencascade` crate and its unlicensed `kicad-parser` never enter the
# graph and need no rows. The binding links STATICALLY into our binaries;
# what that means at go-public is the ledger row's business.
[[licenses.exceptions]]
name = "opencascade-sys"
allow = ["LGPL-2.1-only"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# In-workspace path deps carry no version requirement; that is not the
# wildcard this rule exists to catch.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Ben's fork of opencascade-rs (branch `cicada`, pinned by rev in Cargo.toml)
# — the fork, never upstream: every patch on it is reviewed (DECISIONS.md
# rented-kernels row, revised 2026-08-19).
allow-git = ["https://github.com/bencbartlett/opencascade-rs"]
