# Nightly gates (doc 14 §CI pipeline): full matrix, corpus, benchmarks, audit.
name: Nightly

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC, daily
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-matrix:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # The wall corpus end to end (doc 15 stage 6): build the engine, run the
  # exporters over corpus/wall.cic, and compare against the committed
  # production references through the normalizer. The production 3MFs
  # themselves live outside the repo (50-116 MB); golden/production carries
  # their canonical summaries + the DXF/manifest. Nightly, not per-PR:
  # the cold carve is ~6.5 s and the exporters minutes.
  wall-corpus:
    name: wall corpus end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prime the Manifold kernel build (retry once — belt; see AGENTS.md)
        run: cargo build --locked --release -p cicada-geom || cargo build --locked --release -p cicada-geom
      - name: Build the engine
        run: cargo build --locked --release -p cicada-cli
      - name: Corpus offline tests (scripts + normalizer)
        run: python -m unittest discover -s corpus/tools -p "test_*.py"
      - name: Run the exporters
        run: |
          ./target/release/cicada run corpus/wall.cic --node bambu --node dxf --cache-dir "$RUNNER_TEMP/cicada-corpus-cache"
      - name: Compare against production (verdict = exit code; NOISE passes, FAIL blocks)
        run: python corpus/tools/normalize.py all --ours corpus/out --ref corpus/golden/production --report "$RUNNER_TEMP/corpus-report.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-report
          path: ${{ runner.temp }}/corpus-report.md
          retention-days: 14

  benchmarks:
    name: criterion benchmarks (stub — stage 4+)
    runs-on: ubuntu-latest
    steps:
      - run: echo "stub — criterion baselines land with the first perf-sensitive code (doc 14; baseline storage is an open question)"
