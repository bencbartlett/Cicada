# Nightly gates (doc 14 §CI pipeline): full matrix, corpus, benchmarks, audit.
name: Nightly

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC, daily
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-matrix:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  # The OCCT seam on all three OSes (docs/17 Item 3 WP-A; the per-PR job is
  # Linux only). Same fetch script, same pinned manifest, per-OS prefix. The
  # loader path differs: Linux takes LD_LIBRARY_PATH from the script's env;
  # Windows takes PATH; macOS gets an rpath on the test binaries instead of
  # DYLD_LIBRARY_PATH (SIP strips DYLD_* from protected processes, and conda's
  # dylibs carry @loader_path rpaths, so the executable's rpath is enough).
  # This is also where cross-OS identity of the canonical-bytes golden hashes
  # is measured (per-OS goldens until the three agree — the policy drafted in
  # docs/probes/occt-2026-08.md §4d; docs/17 Item 3 tracks its ledger row).
  occt-matrix:
    name: occt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: occt
      - name: Cache the prebuilt OCCT prefix (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-occt
          key: cicada-occt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_occt_manifest.json') }}
      - name: Prime the Manifold kernel build (retry once — belt; see AGENTS.md)
        run: cargo build --locked -p cicada-geom || cargo build --locked -p cicada-geom
      - name: Fetch the prebuilt OCCT (sha256-pinned) and verify its import closure
        run: |
          python -m pip install --quiet zstandard
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --check-closure
      - name: Test + clippy the seam against the prebuilt
        run: |
          eval "$(python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --print-env bash --quiet)"
          if [ "$RUNNER_OS" = "macOS" ]; then
            unset DYLD_LIBRARY_PATH
            export RUSTFLAGS="-C link-arg=-Wl,-rpath,$DEP_OCCT_ROOT/lib"
          fi
          cargo test --locked -p cicada-geom --features occt
          cargo clippy --locked -p cicada-geom --features occt --all-targets -- -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # The regression corpus (DECISIONS.md corpus row, revised 2026-08-19:
  # every example with committed golden outputs; the wall is the first,
  # at examples/wall/) end to end: build the engine, run the exporters
  # over examples/wall/wall.cic, and compare against the committed
  # production references through the engine-wide normalizer
  # (tools/normalize.py). The production 3MFs themselves live outside the
  # repo (50-116 MB); examples/wall/golden/production carries their
  # canonical summaries + the DXF/manifest. Nightly, not per-PR: the cold
  # carve is ~6.5 s and the exporters minutes.
  wall-corpus:
    name: wall corpus end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prime the Manifold kernel build (retry once — belt; see AGENTS.md)
        run: cargo build --locked --release -p cicada-geom || cargo build --locked --release -p cicada-geom
      - name: Build the engine
        run: cargo build --locked --release -p cicada-cli
      - name: Offline tests (wall scripts + normalizer)
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Run the exporters
        run: |
          ./target/release/cicada run examples/wall/wall.cic --node bambu --node dxf --cache-dir "$RUNNER_TEMP/cicada-corpus-cache"
      - name: Compare against production (verdict = exit code; NOISE passes, FAIL blocks)
        run: python tools/normalize.py all --ours examples/wall/out --ref examples/wall/golden/production --report "$RUNNER_TEMP/corpus-report.md"
      # The report is the evidence, so it rides two channels: the job summary
      # (always available, no storage quota) and an artifact. The artifact
      # upload is non-blocking — the first real corpus run (2026-08-20) PASSED
      # and then went red only because the ACCOUNT-level artifact storage quota
      # was full; the verdict is the normalizer's exit code, nothing else.
      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/corpus-report.md" ]; then
            head -c 900000 "$RUNNER_TEMP/corpus-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no corpus report was written (the compare step did not run to completion)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: corpus-report
          path: ${{ runner.temp }}/corpus-report.md
          retention-days: 14

  benchmarks:
    name: criterion benchmarks (stub — stage 4+)
    runs-on: ubuntu-latest
    steps:
      - run: echo "stub — criterion baselines land with the first perf-sensitive code (doc 14; baseline storage is an open question)"
