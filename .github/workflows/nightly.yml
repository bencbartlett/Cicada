# Nightly gates (doc 14 §CI pipeline): full matrix, corpus, benchmarks, audit.
#
# Every job that builds or runs the engine links OCCT (cicada-geom's `occt`
# feature is on by default since docs/17 Item 3 WP-C) and starts with the
# same fetch steps as ci.yml: setup-python, the cached prebuilt prefix,
# `tools/fetch_occt.py --github-env` (DEP_OCCT_ROOT + the loader path for
# every later step; macOS gets an rpath on the binaries — never a
# job-wide DYLD_LIBRARY_PATH, which made every process load conda's
# libiconv ahead of the system's, ci.yml's header has the run).
name: Nightly

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC, daily
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The whole workspace on all three OSes, against the kernel. This is also
  # where cross-OS identity of the Solid canonical-bytes golden hashes is
  # measured (per-OS goldens until the three agree — DECISIONS.md row 42,
  # revised 2026-08-20; the probe memo docs/probes/occt-2026-08.md §4d
  # drafted it). Linux takes LD_LIBRARY_PATH from the fetch step, Windows
  # PATH, macOS an rpath (conda's dylibs carry @loader_path rpaths, so the
  # executable's rpath is enough).
  test-matrix:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache the prebuilt OCCT prefix (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-occt
          key: cicada-occt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_occt_manifest.json') }}
      - name: Fetch the prebuilt OCCT (sha256-pinned), verify its import closure, export its env
        shell: bash
        run: |
          python -m pip install --quiet zstandard
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --check-closure
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --github-env
      - name: Prime the kernel builds (retry once — belt; see AGENTS.md)
        run: cargo build --locked -p cicada-geom || cargo build --locked -p cicada-geom
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Bundle the built engine and check the bundle (docs/17 L3; Windows + macOS — the bundle refuses Linux, whose rpath is set at link time)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          binary=target/debug/cicada
          if [ "$RUNNER_OS" = Windows ]; then binary=$binary.exe; fi
          python tools/launch/bundle.py --out "$RUNNER_TEMP/cicada-bundle" --binary "$binary" --cache-root "$RUNNER_TEMP/cicada-occt" --allow-no-spa
          python tools/launch/bundle.py --check "$RUNNER_TEMP/cicada-bundle"

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # The regression corpus (DECISIONS.md corpus row, revised 2026-08-19:
  # every example with committed golden outputs; the wall is the first,
  # at examples/wall/) end to end: build the engine, run the exporters
  # over examples/wall/wall.cic, and compare against the committed
  # production references through the engine-wide normalizer
  # (tools/normalize.py). The production 3MFs themselves live outside the
  # repo (50-116 MB); examples/wall/golden/production carries their
  # canonical summaries + the DXF/manifest. Nightly, not per-PR: the cold
  # carve is ~6.5 s and the exporters minutes.
  wall-corpus:
    name: wall corpus end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the prebuilt OCCT prefix (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-occt
          key: cicada-occt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_occt_manifest.json') }}
      - name: Fetch the prebuilt OCCT (sha256-pinned) and export its env
        run: |
          python -m pip install --quiet zstandard
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --github-env
      - name: Prime the kernel builds (retry once — belt; see AGENTS.md)
        run: cargo build --locked --release -p cicada-geom || cargo build --locked --release -p cicada-geom
      - name: Build the engine
        run: cargo build --locked --release -p cicada-cli
      - name: Offline tests (wall scripts + normalizer)
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Run the exporters
        run: |
          ./target/release/cicada run examples/wall/wall.cic --node bambu --node dxf --cache-dir "$RUNNER_TEMP/cicada-corpus-cache"
      - name: Compare against production (verdict = exit code; NOISE passes, FAIL blocks)
        run: python tools/normalize.py all --ours examples/wall/out --ref examples/wall/golden/production --report "$RUNNER_TEMP/corpus-report.md"
      # The report is the evidence, so it rides two channels: the job summary
      # (always available, no storage quota) and an artifact. The artifact
      # upload is non-blocking — the first real corpus run (2026-08-20) PASSED
      # and then went red only because the ACCOUNT-level artifact storage quota
      # was full; the verdict is the normalizer's exit code, nothing else.
      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/corpus-report.md" ]; then
            head -c 900000 "$RUNNER_TEMP/corpus-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no corpus report was written (the compare step did not run to completion)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: corpus-report
          path: ${{ runner.temp }}/corpus-report.md
          retention-days: 14

  # The wall-scale Playwright spec(s): seconds of solve and a ~350 MB display
  # restream per page — nightly, not per PR (the per-PR smoke skips them:
  # CICADA_E2E_HEAVY gates them in the spec files). On the RELEASE engine —
  # the spec is a timing spec (compute-on-release's 1 s bar, the hint while
  # held, one solve on release), and on the debug engine the wall's cold
  # carve took 98–114 s on the runner and every 15 s wait in the spec became
  # a coin flip: red 2026-08-22..24 with no engine change (the first three
  # runs of this job). Release is the profile the docs/15 and docs/17 numbers
  # were taken at; the kernel builds once more for it (rust-cache keeps it).
  playwright-heavy:
    name: Playwright heavy (wall)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the prebuilt OCCT prefix (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-occt
          key: cicada-occt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_occt_manifest.json') }}
      - name: Fetch the prebuilt OCCT (sha256-pinned) and export its env
        run: |
          python -m pip install --quiet zstandard
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --github-env
      - name: Prime the kernel builds (release; retry once — belt; see AGENTS.md)
        run: cargo build --locked --release -p cicada-geom || cargo build --locked --release -p cicada-geom
      - name: Build the SPA
        working-directory: web
        run: npm ci && npm run build
      - name: Build cicada in release with the SPA embedded (the shipped shape)
        run: cargo build --locked --release -p cicada-cli --features embed
      - name: Install the Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Heavy specs
        working-directory: web
        env:
          CICADA_EMBEDDED: "1"
          CICADA_E2E_HEAVY: "1"
          CICADA_BIN: ${{ github.workspace }}/target/release/cicada
        run: npx playwright test e2e/compute_on_release.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: playwright-heavy-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  benchmarks:
    name: criterion benchmarks (stub — stage 4+)
    runs-on: ubuntu-latest
    steps:
      - run: echo "stub — criterion baselines land with the first perf-sensitive code (doc 14; baseline storage is an open question)"
