# Per-PR/push gates (doc 14 §CI pipeline). Nightly jobs live in nightly.yml.
# --locked everywhere: a Cargo.toml/Cargo.lock desync fails loudly instead of
# silently re-resolving to a graph that is not the committed one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prime the Manifold kernel build (retry once — the clone flake was a Windows long-path bug, see AGENTS.md; runners have core.longpaths on, the retry is a belt)
        run: cargo build --locked -p cicada-geom || cargo build --locked -p cicada-geom
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Catalog freshness (stale CATALOG.md fails CI, doc 14)
        run: cargo run --locked -p cicada-cli -- catalog --check

  test-cross:
    # Full tests, not just check: the determinism-hash DoD is
    # cross-platform and should hold at merge time, not nightly-after.
    # Demote to `cargo check` when suite runtime demands (doc 14).
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prime the Manifold kernel build (retry once — belt; see AGENTS.md)
        run: cargo build --locked -p cicada-geom || cargo build --locked -p cicada-geom
      - run: cargo test --locked --workspace

  web:
    name: web tsc · eslint · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test

  # Stubbed until their stages land (doc 15). Kept visible so the CI shape
  # matches doc 14 from day 0 and lighting them up is a one-line change.
  wasm-guest:
    name: WASM guest build (stub — v0.1, out of spike scope)
    runs-on: ubuntu-latest
    steps:
      - run: echo "stub — cicada-guest and the WASM host land in v0.1 (doc 15 out-of-scope)"

  corpus-offline:
    # The wall corpus's Python script nodes + normalizer, offline (no
    # engine, no wall repo — the production cross-checks skip). The full
    # engine end-to-end + output-hash comparison is nightly (wall-corpus).
    name: corpus scripts · normalizer (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s corpus/tools -p "test_*.py"

  playwright-smoke:
    # doc 15 stage 5 DoD: serve → place → wire → drag → screenshot asserts
    # geometry changed, headless, against the RELEASE shape (SPA embedded).
    name: Playwright smoke (serve → place → wire → drag → screenshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prime the Manifold kernel build (retry once — belt; see AGENTS.md)
        run: cargo build --locked -p cicada-geom || cargo build --locked -p cicada-geom
      - name: Build the SPA
        working-directory: web
        run: npm ci && npm run build
      - name: Build cicada with the SPA embedded (the release shape)
        run: cargo build --locked -p cicada-cli --features embed
      - name: Install the Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Smoke
        working-directory: web
        env:
          CICADA_EMBEDDED: "1"
          CICADA_BIN: ${{ github.workspace }}/target/debug/cicada
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
