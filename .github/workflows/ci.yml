# Per-PR/push gates (doc 14 §CI pipeline). Nightly jobs live in nightly.yml.
# --locked everywhere: a Cargo.toml/Cargo.lock desync fails loudly instead of
# silently re-resolving to a graph that is not the committed one.
#
# OCCT (docs/17 Item 3 WP-C; docs/03 §The seam): since the product's
# `box`/`extrude`/… nodes are OCCT-backed, cicada-geom's `occt` feature is ON
# by default and EVERY job that builds or runs the workspace links the
# kernel. Each such job therefore starts with the same three steps:
# setup-python, the actions/cache of the prebuilt prefix (key = the pinned
# manifest), and `tools/fetch_occt.py --github-env`, which fetches the
# sha256-pinned conda-forge OCCT 7.8.1 prefix (+ the run-time closure its
# libraries load) into the runner's temp dir and exports DEP_OCCT_ROOT, the
# loader path (LD_LIBRARY_PATH / PATH) and CMAKE_POLICY_VERSION_MINIMUM for
# every later step. macOS gets an rpath on the binaries (RUSTFLAGS) and
# NEVER a job-wide DYLD_LIBRARY_PATH: the conda prefix ships its own
# libiconv and codec dylibs, and a loader variable for the whole job made
# cargo segfault and git die on them (run 32506547681, 2026-08-21). The
# Linux job also verifies the prefix's import closure statically.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache the prebuilt OCCT prefix (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-occt
          key: cicada-occt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_occt_manifest.json') }}
      - name: Fetch the prebuilt OCCT (sha256-pinned), verify its import closure, export its env
        run: |
          python -m pip install --quiet zstandard
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --check-closure
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --github-env
      - name: Cache the prebuilt Manifold (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-manifold
          key: cicada-manifold-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('tools/fetch_manifold_manifest.json') }}
      - name: Build once or reuse the prebuilt Manifold, export its env (AGENTS.md iteration-speed rule 6)
        shell: bash
        run: python tools/fetch_manifold.py --dest "$RUNNER_TEMP/cicada-manifold" --github-env
      - name: Prime the kernel builds (retry once — the clone flake was a Windows long-path bug, see AGENTS.md; runners have core.longpaths on, the retry is a belt)
        run: cargo build --locked -p cicada-geom || cargo build --locked -p cicada-geom
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: The prebuilt Manifold's pin agrees with the crate it mirrors (the registry is warm here; a skip would hide a drifted pin, so the test fails instead)
        env:
          CICADA_REQUIRE_SYS_CRATE: "1"
        run: python -m unittest discover -s tools -p "test_fetch_manifold.py" -v
      - name: The kernel-free world still passes (every Solid call a typed refusal, docs/03 — cicada-geom's seam and, since the review closure of 2026-08-21, the stdlib's Solid nodes through their own `occt` feature)
        run: |
          cargo test --locked -p cicada-geom --no-default-features
          cargo test --locked -p cicada-stdlib --no-default-features
      - name: Catalog freshness (stale CATALOG.md fails CI, doc 14)
        run: cargo run --locked -p cicada-cli -- catalog --check

  test-cross:
    # Full tests, not just check: the determinism-hash DoD is
    # cross-platform and should hold at merge time, not nightly-after.
    # This is also where cross-OS identity of the Solid golden hashes is
    # measured (per-OS goldens until the three agree — DECISIONS.md row 42).
    # Demote to `cargo check` when suite runtime demands (doc 14).
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the prebuilt OCCT prefix (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-occt
          key: cicada-occt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_occt_manifest.json') }}
      - name: Fetch the prebuilt OCCT (sha256-pinned) and export its env
        shell: bash
        run: |
          python -m pip install --quiet zstandard
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --github-env
      - name: Cache the prebuilt Manifold (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-manifold
          key: cicada-manifold-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('tools/fetch_manifold_manifest.json') }}
      - name: Build once or reuse the prebuilt Manifold, export its env (AGENTS.md iteration-speed rule 6)
        shell: bash
        run: python tools/fetch_manifold.py --dest "$RUNNER_TEMP/cicada-manifold" --github-env
      - name: Prime the kernel builds (retry once — belt; see AGENTS.md)
        run: cargo build --locked -p cicada-geom || cargo build --locked -p cicada-geom
      - run: cargo test --locked --workspace

  web:
    name: web tsc · eslint · vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test

  # Stubbed until their stages land (doc 15). Kept visible so the CI shape
  # matches doc 14 from day 0 and lighting them up is a one-line change.
  wasm-guest:
    name: WASM guest build (stub — v0.1, out of spike scope)
    runs-on: ubuntu-latest
    steps:
      - run: echo "stub — cicada-guest and the WASM host land in v0.1 (doc 15 out-of-scope)"

  corpus-offline:
    # The wall corpus's Python script nodes + normalizer, offline (no
    # engine, no wall repo — the production cross-checks skip). The full
    # engine end-to-end + output-hash comparison is nightly (wall-corpus).
    name: corpus scripts · normalizer (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p "test_*.py"

  playwright-smoke:
    # doc 15 stage 5 DoD: serve → place → wire → drag → screenshot asserts
    # geometry changed, headless, against the RELEASE shape (SPA embedded).
    # The engine Playwright starts links OCCT: the fetch step's loader path
    # reaches it through the step environment.
    name: Playwright smoke (serve → place → wire → drag → screenshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the prebuilt OCCT prefix (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-occt
          key: cicada-occt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_occt_manifest.json') }}
      - name: Fetch the prebuilt OCCT (sha256-pinned) and export its env
        run: |
          python -m pip install --quiet zstandard
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --github-env
      - name: Cache the prebuilt Manifold (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-manifold
          key: cicada-manifold-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('tools/fetch_manifold_manifest.json') }}
      - name: Build once or reuse the prebuilt Manifold, export its env (AGENTS.md iteration-speed rule 6)
        shell: bash
        run: python tools/fetch_manifold.py --dest "$RUNNER_TEMP/cicada-manifold" --github-env
      - name: Prime the kernel builds (retry once — belt; see AGENTS.md)
        run: cargo build --locked -p cicada-geom || cargo build --locked -p cicada-geom
      - name: Build the SPA
        working-directory: web
        run: npm ci && npm run build
      - name: Build cicada with the SPA embedded (the release shape)
        run: cargo build --locked -p cicada-cli --features embed
      - name: Install the Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Smoke
        working-directory: web
        env:
          CICADA_EMBEDDED: "1"
          CICADA_BIN: ${{ github.workspace }}/target/debug/cicada
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
