# Releases (docs/17 wave 5 R1; DECISIONS.md 2026-08-25): a `v<version>` tag
# on the commit whose Cargo.toml carries that workspace version builds the
# app in release with the SPA embedded, bundles Windows and macOS with the
# kernel's run-time libraries beside the binary (`tools/launch/bundle.py`,
# checked and smoked — the bundle refuses Linux by design, so Linux ships the
# bare binary), and publishes a GitHub Release whose body is CHANGELOG.md's
# section for the version — a pre-release while the version carries a `-`
# suffix (`0.1.0-alpha.1`). Nothing is published until every asset built and
# passed its check: the release job runs last, over the four artifacts.
#
# The first job refuses a tag that does not name Cargo.toml's version or a
# CHANGELOG without its section (`tools/changelog.py check --tag`), so a
# stray tag stops there with the reason, never as a release that describes
# another version. `CICADA_GIT_SHA` stamps the tag's commit into every
# binary (`crates/cicada-cli/build.rs`) — never `-dirty`, whatever the
# runner's checkout looks like.
#
# The kernel steps are ci.yml's (the prebuilt OCCT and Manifold, cached by
# their manifests; macOS an rpath on the binaries and never a job-wide
# DYLD_LIBRARY_PATH — ci.yml's header has the run that taught it).
name: Release

on:
  push:
    tags: ["v*"]

# The token is read-only everywhere but the publishing job: the build jobs
# run `npm ci` and every dependency's build script, and a write-capable
# token there could push a tag or publish a release from a compromised
# package (fix round 2026-09-20, finding L3-4); their checkouts keep no
# credentials in `.git/config` either.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # `CICADA_GIT_SHA` and `SOURCE_DATE_EPOCH` are set per build job from the
  # checkout's own HEAD (the "stamp" step), not from `github.sha` here: for
  # an annotated tag the pushed object is the tag, not its commit, and a
  # stamp that both fed and checked itself proved nothing (findings L3-5,
  # R1-C8).

jobs:
  notes:
    name: The tag names the workspace version; the CHANGELOG has its section
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The licensing files a release must carry are in place (DECISIONS.md 2026-08-11, 2026-08-20)
        run: |
          # A tag ships nothing without the licence the 2026-08-11 row defers to
          # "first public release" and the third-party notices the 2026-08-20
          # row binds to "shipping binaries" (the LGPL kernel libraries beside
          # the binary): stop here with the reason, never as a release the
          # ledger forbids (fix round 2026-09-20, finding R1-C3). The bundles
          # copy both beside their README (tools/launch/bundle.py NOTICE_FILES).
          status=0
          for name in LICENSE THIRD_PARTY_NOTICES.md; do
            if [ ! -s "$name" ]; then
              echo "error: no $name at the repository root — a release ships nothing without it (DECISIONS.md: the licence is chosen at first public release; the third-party notices are due with shipped binaries)" >&2
              status=1
            fi
          done
          exit $status
      - id: version
        name: Check the tag against Cargo.toml and CHANGELOG.md, write the release body
        run: |
          python tools/changelog.py check --tag "$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          {
            python tools/changelog.py section "$version"
            echo
            python tools/changelog.py assets "$version"
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  bundle:
    name: bundle (${{ matrix.slug }})
    needs: notes
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            slug: windows
          - os: macos-latest
            slug: macos
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.notes.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the prebuilt OCCT prefix (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-occt
          key: cicada-occt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_occt_manifest.json') }}
      - name: Fetch the prebuilt OCCT (sha256-pinned), verify its import closure, export its env
        shell: bash
        run: |
          python -m pip install --quiet zstandard
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --check-closure
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --github-env
      - name: Cache the prebuilt Manifold (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-manifold
          key: cicada-manifold-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('tools/fetch_manifold_manifest.json') }}
      - name: Build once or reuse the prebuilt Manifold, export its env (AGENTS.md iteration-speed rule 6)
        shell: bash
        run: python tools/fetch_manifold.py --dest "$RUNNER_TEMP/cicada-manifold" --github-env
      - name: Prime the kernel builds (release; retry once — belt; see AGENTS.md)
        shell: bash
        run: cargo build --locked --release -p cicada-geom || cargo build --locked --release -p cicada-geom
      - name: Build the SPA
        working-directory: web
        shell: bash
        run: npm ci && npm run build
      - name: Stamp the checkout's HEAD and its commit date into the build (HEAD must be the pushed object's commit)
        shell: bash
        run: bash tools/release_stamp.sh
      - name: Build cicada in release with the SPA embedded (the shipped shape)
        shell: bash
        run: cargo build --locked --release -p cicada-cli --features embed
      - name: The binary says the tag's version, HEAD's commit and HEAD's date
        shell: bash
        run: |
          binary=target/release/cicada
          if [ "$RUNNER_OS" = Windows ]; then binary=$binary.exe; fi
          bash tools/release_stamp.sh --check "$("$binary" --version)" "$VERSION"
      - name: Bundle, check and smoke (docs/17 L3 — the run-time libraries beside the binary; `cicada app --no-browser` from inside the bundle under a minimal env)
        shell: bash
        run: |
          binary=target/release/cicada
          if [ "$RUNNER_OS" = Windows ]; then binary=$binary.exe; fi
          out="$RUNNER_TEMP/Cicada-$VERSION-${{ matrix.slug }}"
          python tools/launch/bundle.py --out "$out" --binary "$binary" --cache-root "$RUNNER_TEMP/cicada-occt" --release
          python tools/launch/bundle.py --check "$out" --smoke
      - name: Zip the bundle folder (`Cicada-<version>-<os>.zip` unpacks to that folder)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          name="Cicada-$VERSION-${{ matrix.slug }}"
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$name.zip' -CompressionLevel Optimal"
          else
            ditto -c -k --sequesterRsrc --keepParent "$name" "$name.zip"
          fi
          ls -l "$name.zip"
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          mv "$name.zip" "$GITHUB_WORKSPACE/release-assets/"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.slug }}
          path: release-assets/*.zip
          if-no-files-found: error

  linux:
    name: bare binary (Linux)
    needs: notes
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.notes.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the prebuilt OCCT prefix (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-occt
          key: cicada-occt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch_occt_manifest.json') }}
      - name: Fetch the prebuilt OCCT (sha256-pinned), verify its import closure, export its env
        run: |
          python -m pip install --quiet zstandard
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --check-closure
          python tools/fetch_occt.py --dest "$RUNNER_TEMP/cicada-occt" --github-env
      - name: Cache the prebuilt Manifold (key = the pinned manifest)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cicada-manifold
          key: cicada-manifold-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('tools/fetch_manifold_manifest.json') }}
      - name: Build once or reuse the prebuilt Manifold, export its env (AGENTS.md iteration-speed rule 6)
        run: python tools/fetch_manifold.py --dest "$RUNNER_TEMP/cicada-manifold" --github-env
      - name: Prime the kernel builds (release; retry once — belt; see AGENTS.md)
        run: cargo build --locked --release -p cicada-geom || cargo build --locked --release -p cicada-geom
      - name: Build the SPA
        working-directory: web
        run: npm ci && npm run build
      - name: Stamp the checkout's HEAD and its commit date into the build (HEAD must be the pushed object's commit)
        run: bash tools/release_stamp.sh
      - name: Build cicada in release with the SPA embedded (the shipped shape)
        run: cargo build --locked --release -p cicada-cli --features embed
      - name: The binary says the tag's version, HEAD's commit and HEAD's date; name it for the release
        run: |
          bash tools/release_stamp.sh --check "$(./target/release/cicada --version)" "$VERSION"
          mkdir -p release-assets
          cp target/release/cicada "release-assets/cicada-$VERSION-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-linux
          path: release-assets/cicada-*-linux-x86_64
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: [notes, bundle, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.notes.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release with every asset (a pre-release while the version carries a `-` suffix)
        run: |
          ls -l dist
          prerelease=""
          if [ "${{ needs.notes.outputs.prerelease }}" = "true" ]; then prerelease="--prerelease"; fi
          # LICENSE and THIRD_PARTY_NOTICES.md ride as assets too (the notes
          # job refused to get here without them): the Linux binary has no
          # folder to carry them in, the zips carry their own copies.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Cicada $VERSION" \
            --notes-file dist/release-notes.md \
            $prerelease \
            dist/Cicada-"$VERSION"-windows.zip \
            dist/Cicada-"$VERSION"-macos.zip \
            dist/cicada-"$VERSION"-linux-x86_64 \
            LICENSE \
            THIRD_PARTY_NOTICES.md
